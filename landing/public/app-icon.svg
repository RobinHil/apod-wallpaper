<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="planet" cx="38%" cy="32%" r="85%">
      <stop offset="0%" stop-color="#9cc2ff"/>
      <stop offset="45%" stop-color="#4c85f0"/>
      <stop offset="100%" stop-color="#1d3d8f"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c7d8f7" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#dce8ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c7d8f7" stop-opacity="0.35"/>
    </linearGradient>
    <clipPath id="lowerHalf">
      <rect x="-360" y="0" width="720" height="360"/>
    </clipPath>
  </defs>

  <!-- Planete annelee, fond transparent -->
  <g transform="translate(512 512) scale(1.35) rotate(-22)">
    <!-- Anneau arriere (masque ensuite par la planete) -->
    <ellipse cx="0" cy="0" rx="332" ry="108" fill="none"
             stroke="url(#ring)" stroke-width="34" opacity="0.85"/>
    <!-- Planete -->
    <circle cx="0" cy="0" r="196" fill="url(#planet)"/>
    <!-- Terminateur : ombre douce sur le limbe -->
    <path d="M -196 0 a 196 196 0 0 0 392 0 a 240 196 0 0 1 -392 0 z"
          fill="#0a0d1c" opacity="0.35"/>
    <!-- Anneau avant (moitie basse uniquement) -->
    <ellipse cx="0" cy="0" rx="332" ry="108" fill="none"
             stroke="url(#ring)" stroke-width="34" clip-path="url(#lowerHalf)"/>
  </g>

  <!-- Satellite -->
  <circle cx="912" cy="539" r="35" fill="#8ea6cf"/>
  <circle cx="901" cy="528" r="11" fill="#b9c9e8" opacity="0.8"/>
</svg>
