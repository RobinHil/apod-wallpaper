server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The bundle carries hashed file names, so everything under /assets can be
    # cached for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The prerendered pages never can: they are what point at the current
    # hashes, and each language has one of them.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # `/fr/` is a directory with its own index.html, so a trailing slash is
    # enough. An unknown address is a 404 and says so: falling back to the
    # English page would answer 200 with the wrong content, which is what
    # search engines call a soft 404.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
