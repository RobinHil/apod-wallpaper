[package]
name = "apod-wallpaper"
version = "0.1.0"
description = "Sets NASA's Astronomy Picture of the Day as your desktop wallpaper"
authors = ["Robin HILAIRE"]
license = "MIT"
repository = "https://github.com/RobinHil/apod-wallpaper"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the library name distinct from the binary's, which
# cargo otherwise refuses (rust-lang/cargo#8519).
name = "apod_wallpaper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# `#[tokio::test]` for the handful of tests that need a runtime. `rt` is the
# single-threaded runtime it builds; the crate itself builds its own.
tokio = { version = "1.53.1", features = ["macros", "rt"] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", features = ["json", "query"] }
# `macros` is `select!`, which the scheduler races its sleep with.
tokio = { version = "1.53.1", features = ["sync", "time", "rt-multi-thread", "macros"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
rand = "0.10.2"
chrono = { version = "0.4.45", features = ["serde"] }
tauri-plugin-single-instance = "2.4.3"

# The four things that are not portable -- setting the desktop picture, being
# told about screen changes and wake-ups, measuring the screen, and pulling a
# frame out of a video -- are the only per-platform dependencies. Everything
# above this line is shared (see `wallpaper`, `os_events`, `screen` and
# `video_frame`, each of which dispatches on `target_os`).

# AppKit and AVFoundation are already compiled as part of Tauri's macOS
# backend, so the `objc2` crates add nothing to the build.
[target.'cfg(target_os = "macos")'.dependencies]
wallpaper = "3.2.0"
block2 = "0.6"
# Only for `Retained`, to name the two objects the video decoder holds on to.
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSNotification", "NSOperation", "NSString", "NSURL"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVAsset", "AVAssetImageGenerator", "objc2-core-media", "objc2-core-graphics"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMTime"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage", "CGContext", "CGColorSpace", "CGBitmapContext"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }

# The same argument on the GNOME side. GLib, GIO and GTK are already linked by
# Tauri's Linux backend, so GSettings and GDBus cost nothing extra; `gio` 0.18
# is the version `gtk` 0.18 already pulls in.
#
# GStreamer is deliberately pinned to the release that wants that same glib
# 0.18: a newer one would drag a second copy of glib into the tree for a
# handful of video APODs a year. The codecs stay the system's, exactly as
# AVFoundation's are on macOS -- nothing is bundled here either.
[target.'cfg(target_os = "linux")'.dependencies]
# Only for `malloc_trim`, to hand an update's working set back to the kernel;
# see `memory`. Already in the tree by way of half a dozen crates.
libc = "0.2"
gio = "0.18"
glib = "0.18"
gstreamer = "0.21"
gstreamer-video = "0.21"

[profile.release]
# A background utility: trade compile time for a smaller, faster binary.
lto = "fat"
codegen-units = 1
strip = true
# `panic = "abort"` is deliberately not set: image decoding runs inside a
# spawn_blocking task, and a malformed file must surface as an error rather
# than take the whole app down.
