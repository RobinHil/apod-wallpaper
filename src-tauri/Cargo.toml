[package]
name = "apod-wallpaper"
version = "0.1.0"
description = "Sets NASA's Astronomy Picture of the Day as your desktop wallpaper"
authors = ["Robin HILAIRE"]
repository = "https://github.com/RobinHil/apod-wallpaper"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "apod_wallpaper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# `#[tokio::test]` for the handful of tests that need a runtime; the crate
# itself drives its runtime by hand and needs neither feature.
tokio = { version = "1.52.3", features = ["macros", "rt"] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", features = ["json", "query"] }
tokio = { version = "1.52.3", features = ["sync", "time", "rt-multi-thread"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
rand = "0.10.2"
chrono = { version = "0.4.45", features = ["serde"] }
wallpaper = "3.2.0"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-autostart = "2"

# Watching for screen changes and resumes from sleep, so the scheduler can wait
# on events instead of waking up to look for them (see `os_events`). Every
# crate below is already compiled as part of Tauri's backend for that platform,
# so naming it here adds nothing to the build.

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSNotification", "NSOperation", "NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
gdk = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
# `Win32_Graphics_Gdi` is not a drawing dependency: `WNDCLASSW` carries a
# brush and a cursor, so windows-sys gates the struct itself behind it.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
# A background utility: trade compile time for a smaller, faster binary.
lto = "fat"
codegen-units = 1
strip = true
# `panic = "abort"` is deliberately not set: image decoding runs inside a
# spawn_blocking task, and a malformed file must surface as an error rather
# than take the whole app down.
