[package]
name = "apod-wallpaper"
version = "0.1.0"
description = "Sets NASA's Astronomy Picture of the Day as your desktop wallpaper"
authors = ["Robin HILAIRE"]
repository = "https://github.com/RobinHil/apod-wallpaper"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the library name distinct from the binary's, which
# cargo otherwise refuses (rust-lang/cargo#8519).
name = "apod_wallpaper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# `#[tokio::test]` for the handful of tests that need a runtime. `rt` is the
# single-threaded runtime it builds; the crate itself builds its own.
tokio = { version = "1.52.3", features = ["macros", "rt"] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", features = ["json", "query"] }
# `macros` is `select!`, which the scheduler races its sleep with.
tokio = { version = "1.52.3", features = ["sync", "time", "rt-multi-thread", "macros"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
rand = "0.10.2"
chrono = { version = "0.4.45", features = ["serde"] }
tauri-plugin-single-instance = "2.4.2"

# Setting the desktop picture, and watching for the screen changes and wake-ups
# the scheduler has to react to (see `wallpaper` and `os_events`). AppKit is
# already compiled as part of Tauri's macOS backend, so the `objc2` crates add
# nothing to the build.
wallpaper = "3.2.0"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSNotification", "NSOperation", "NSString"] }

[profile.release]
# A background utility: trade compile time for a smaller, faster binary.
lto = "fat"
codegen-units = 1
strip = true
# `panic = "abort"` is deliberately not set: image decoding runs inside a
# spawn_blocking task, and a malformed file must surface as an error rather
# than take the whole app down.
