name: Landing

# The marketing page under landing/ has nothing to do with the application: it
# is a static site, it builds in seconds, and it ships to GitHub Pages rather
# than to a release. Hence a workflow of its own, triggered only by its own
# directory, so a Rust change never rebuilds it and a copy fix never rebuilds
# the packages.
#
# It needs Pages set to build from GitHub Actions, in Settings > Pages; the
# `configure-pages` step below reads that configuration rather than assuming
# an address, which is what makes a custom domain work without editing this
# file.
on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - ".github/workflows/landing.yml"
  pull_request:
    branches: [main]
    paths:
      - "landing/**"
      - ".github/workflows/landing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds the site and proves the build is worth deploying. A pull request
  # stops here; nothing is published from a branch.
  build:
    name: Build and check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v7

      # pnpm goes before setup-node, which needs it on the PATH to find the
      # store it is being asked to cache. The version comes from
      # `packageManager` in landing/package.json, so the two cannot drift.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: landing/package.json

      # 24 is the active LTS and the version ci.yml builds the application
      # with; the two are kept the same on purpose. The Pages actions above
      # and below run on their own runtime, which is why they are pinned to
      # releases that ship Node 24 rather than the deprecated Node 20.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck the page
        run: pnpm exec tsc --noEmit

      # Where the site will live, asked of Pages rather than written down:
      # this answers correctly for a project site, a user site and a custom
      # domain alike, and the canonical URLs, the hreflang pair, the sitemap
      # and the social cards are all derived from it.
      - uses: actions/configure-pages@v6
        id: pages

      - name: Build the static site
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          # Optional. Unset, the page uses NASA's DEMO_KEY and falls back to
          # its own painted sky when that shared key is exhausted.
          VITE_NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: pnpm build

      # What the build is expected to have produced, asserted rather than
      # assumed. Two of these have already caught something during
      # development: a template rewrite silently dropped the stylesheet, and
      # prerendering is pointless the day the HTML comes out empty again.
      - name: Assert the build is complete
        env:
          ORIGIN: ${{ steps.pages.outputs.origin }}
          BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          cd dist

          for file in index.html fr/index.html 404.html sitemap.xml robots.txt \
                      og-en.png og-fr.png app-icon.svg; do
            test -f "$file" || { echo "missing: $file"; exit 1; }
          done

          # The pages carry their text, not an empty mount point, and each one
          # tells the client which language it was rendered in.
          grep -q "Every morning" index.html
          grep -q "Chaque matin" fr/index.html
          grep -q 'data-locale="en"' index.html
          grep -q 'data-locale="fr"' fr/index.html

          # Both pages reference a stylesheet and a bundle, and every asset
          # they name exists under the hashed name they name it by.
          for page in index.html fr/index.html; do
            grep -q 'assets/[^"]*\.css' "$page" || { echo "no stylesheet in $page"; exit 1; }
            grep -q 'assets/[^"]*\.js' "$page" || { echo "no bundle in $page"; exit 1; }

            for asset in $(grep -oE '/[^"]*assets/[^"]*\.(css|js)' "$page" | sort -u); do
              # The URLs are absolute and include the base path; strip it to
              # get back to a path inside dist.
              relative=".${asset#"${BASE%/}"}"
              test -f "$relative" || { echo "dangling asset: $asset"; exit 1; }
            done
          done

          # The head a crawler reads: a canonical per page, both languages
          # declared on both, and absolute URLs for the card images.
          grep -q "rel=\"canonical\" href=\"$ORIGIN" index.html
          grep -q 'hreflang="fr"' index.html
          grep -q 'hreflang="en"' fr/index.html
          grep -q "og:image\" content=\"$ORIGIN" index.html
          grep -q "$ORIGIN" sitemap.xml

          echo "dist is complete:"
          du -sh .
          ls -1

      - uses: actions/upload-pages-artifact@v5
        with:
          path: landing/dist

  # Publishes what the build job checked. Pages requires these permissions and
  # this environment; the concurrency group is the one Pages deployments share,
  # and it does not cancel a deployment already in flight.
  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Asks the published site the same questions over the network, because a
  # deployment that reports success and then serves something else is a thing
  # that happens. It is also the only step that exercises the real base path.
  verify:
    name: Verify what is published
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch the published pages
        env:
          SITE: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          site="${SITE%/}"
          echo "site: $site"

          # Pages usually serves the new version within seconds of the
          # deployment, but not always instantly.
          for attempt in 1 2 3 4 5; do
            if curl -fsS "$site/" -o /tmp/en.html; then break; fi
            echo "attempt $attempt failed, waiting"
            sleep 10
          done

          curl -fsS "$site/fr/" -o /tmp/fr.html
          curl -fsS "$site/sitemap.xml" -o /tmp/sitemap.xml
          curl -fsS -o /dev/null "$site/og-en.png"
          curl -fsS -o /dev/null "$site/app-icon.svg"

          grep -q "Every morning" /tmp/en.html
          grep -q "Chaque matin" /tmp/fr.html
          grep -q "rel=\"canonical\" href=\"$site/\"" /tmp/en.html
          grep -q "$site/fr/" /tmp/sitemap.xml

          # An address that is not there gets the site's own 404 page, which
          # only exists because the prerender writes one.
          curl -sS "$site/nothing-here" | grep -q "This corner of the sky"

          echo "verified $site"
