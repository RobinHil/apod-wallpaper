name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate: nothing is built until formatting, lints, types and tests pass once.
  check:
    name: Lint and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: check

      - name: Check Rust formatting
        run: cargo fmt --all --check
        working-directory: src-tauri

      # Twice, and the first one is not redundant. `--all-targets` builds the
      # tests, which pull in the dev-dependencies, and cargo unifies their
      # features with the library's: a feature the code needs but the manifest
      # never asks for is supplied by a dev-dependency and the build passes --
      # right up until the release build, which has no dev-dependencies and
      # fails. This is what the app is actually shipped as.
      - name: Clippy (as shipped)
        run: cargo clippy --locked -- -D warnings
        working-directory: src-tauri

      - name: Clippy (with tests)
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Tests
        run: cargo test --locked
        working-directory: src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck the frontend
        run: npx tsc --noEmit

      # The version is declared in three files that nothing else keeps in
      # step, and a mismatch only shows up as mislabelled release artifacts.
      - name: Check the declared versions agree
        run: |
          npm_version=$(node -p "require('./package.json').version")
          conf_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_version=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "package.json=$npm_version tauri.conf.json=$conf_version Cargo.toml=$cargo_version"
          if [ "$npm_version" != "$conf_version" ] || [ "$npm_version" != "$cargo_version" ]; then
            echo "::error::the version is declared three times and the three disagree"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$npm_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the declared version $npm_version"
            exit 1
          fi

  build:
    name: Build ${{ matrix.label }}
    needs: check
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both bundles come off the Apple-silicon runner, the x86_64 one by
          # cross-compiling. The Intel runners have been retired, and a job
          # asking for one no longer fails -- it sits in the queue until
          # something times out, which is what the timeout above is for.
          - label: macos-x86_64
            target: x86_64-apple-darwin
          - label: macos-aarch64
            target: aarch64-apple-darwin
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Build bundles
        run: npm run bundle -- --target ${{ matrix.target }}

      # `LSUIElement` is what keeps the app out of the Dock, and it comes from
      # `Info.plist` being merged into the bundle. A merge that silently stops
      # happening would otherwise only show up as a Dock icon on someone's Mac.
      - name: Check the bundled Info.plist
        run: |
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/APOD Wallpaper.app"
          plist="$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$plist"
          /usr/libexec/PlistBuddy -c 'Print :NSAppleEventsUsageDescription' "$plist"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          if-no-files-found: error
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    # Only downloads the artifacts and attaches them to the tag: nothing is
    # compiled here, so the cheapest runner does.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
          # These builds are unsigned; the README explains the Gatekeeper step
          # users need.
          body: |
            Unsigned builds. After installing, run
            `xattr -d com.apple.quarantine "/Applications/APOD Wallpaper.app"`.
            See the README for details.
