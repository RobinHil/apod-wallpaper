name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate: nothing is built until formatting, lints, types and tests pass once.
  #
  # Clippy and the tests run on all three platforms, because a good third of
  # the unsafe code in this app -- the AppKit and Win32 observers in
  # `os_events` -- is compiled out everywhere but its own target, and would
  # otherwise reach the build job unlinted.
  check:
    name: Lint and test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            os: ubuntu-24.04
            primary: true
          - label: macos
            os: macos-15
          - label: windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: check-${{ matrix.label }}

      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Check Rust formatting
        if: matrix.primary
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Tests
        run: cargo test --locked
        working-directory: src-tauri

      # Frontend and manifest checks are platform-independent: once is enough.
      - uses: actions/setup-node@v5
        if: matrix.primary
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        if: matrix.primary
        run: npm ci

      - name: Typecheck the frontend
        if: matrix.primary
        run: npx tsc --noEmit

      # The version is declared in three files that nothing else keeps in
      # step, and a mismatch only shows up as mislabelled release artifacts.
      - name: Check the declared versions agree
        if: matrix.primary
        run: |
          npm_version=$(node -p "require('./package.json').version")
          conf_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_version=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "package.json=$npm_version tauri.conf.json=$conf_version Cargo.toml=$cargo_version"
          if [ "$npm_version" != "$conf_version" ] || [ "$npm_version" != "$cargo_version" ]; then
            echo "::error::the version is declared three times and the three disagree"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$npm_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the declared version $npm_version"
            exit 1
          fi

  build:
    name: Build ${{ matrix.label }}
    needs: check
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          # ARM runners are free for public repositories but billed on a
          # private one; there, drop this entry (the macOS ones below have no
          # alternative left, see the note on them).
          - label: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # Both macOS bundles come off the Apple-silicon runner, the x86_64
          # one by cross-compiling. The Intel macOS runners have been retired,
          # and a job asking for one no longer fails -- it sits in the queue
          # until something times out, which is what the timeout above is for.
          - label: macos-x86_64
            os: macos-15
            target: x86_64-apple-darwin
          - label: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # `xdg-utils` is not part of the runner image and is not a build
      # dependency of the app: linuxdeploy looks for `xdg-open` while
      # assembling the AppImage, and bundling fails outright without it.
      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf xdg-utils

      - run: npm ci

      - name: Build bundles
        run: npm run tauri build -- --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.label }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          # These builds are unsigned; the README explains the Gatekeeper and
          # SmartScreen steps users need.
          body: |
            Unsigned builds. On macOS run
            `xattr -d com.apple.quarantine "/Applications/APOD Wallpaper.app"`
            after installing; on Windows choose "More info" then "Run anyway"
            in SmartScreen. See the README for details.
