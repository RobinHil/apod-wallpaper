name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate: nothing is built until formatting, lints, types and tests pass once.
  #
  # On both platforms, and that is not duplication for its own sake: clippy and
  # the compiler only ever see the `cfg` branch of the host they run on, so the
  # GNOME backends are invisible to a macOS job and the Apple ones invisible to
  # a Linux job. One platform alone would let half the per-platform code rot.
  check:
    name: Lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7

      # webkit2gtk is what Tauri's Linux backend links against, and the
      # appindicator library is what the tray needs; the GStreamer development
      # packages are for `video_frame`. None of this exists on the runner image.
      - name: Install the Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update

          # Asked for on its own, deliberately. The runner image ships LLVM's
          # `libunwind-14-dev`, which conflicts with the plain `libunwind-dev`
          # that `libgstreamer1.0-dev` depends on. Put in the same transaction
          # as everything below, apt gives up on the lot with "held broken
          # packages"; given this one conflict by itself, it resolves it and
          # moves on. Nothing here wants LLVM's copy.
          sudo apt-get install --no-install-recommends -y libunwind-dev

          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: check-${{ matrix.os }}

      - name: Check Rust formatting
        run: cargo fmt --all --check
        working-directory: src-tauri

      # Twice, and the first one is not redundant. `--all-targets` builds the
      # tests, which pull in the dev-dependencies, and cargo unifies their
      # features with the library's: a feature the code needs but the manifest
      # never asks for is supplied by a dev-dependency and the build passes --
      # right up until the release build, which has no dev-dependencies and
      # fails. This is what the app is actually shipped as.
      - name: Clippy (as shipped)
        run: cargo clippy --locked -- -D warnings
        working-directory: src-tauri

      - name: Clippy (with tests)
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Tests
        run: cargo test --locked
        working-directory: src-tauri

      # The Rust side is checked on both platforms because the `cfg` branches
      # differ. Everything below this line does not: the panel and the version
      # numbers are the same files whatever the runner, so they are checked
      # once, on the runner that is not also building the release bundle.
      #
      # pnpm goes before setup-node, which needs it on the PATH to find the
      # store it is being asked to cache. The version comes from
      # `packageManager` in package.json, so the two cannot drift apart.
      - uses: pnpm/action-setup@v6
        if: runner.os == 'Linux'

      - uses: actions/setup-node@v7
        if: runner.os == 'Linux'
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        if: runner.os == 'Linux'
        run: pnpm install --frozen-lockfile

      - name: Typecheck the frontend
        if: runner.os == 'Linux'
        run: pnpm exec tsc --noEmit

      # The version is declared in four files that nothing else keeps in
      # step, and a mismatch only shows up as mislabelled release artifacts.
      - name: Check the declared versions agree
        if: runner.os == 'Linux'
        run: |
          npm_version=$(node -p "require('./package.json').version")
          conf_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_version=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          pkgbuild_version=$(grep -m1 '^pkgver=' packaging/arch/PKGBUILD | cut -d= -f2)
          echo "package.json=$npm_version tauri.conf.json=$conf_version Cargo.toml=$cargo_version PKGBUILD=$pkgbuild_version"
          for declared in "$conf_version" "$cargo_version" "$pkgbuild_version"; do
            if [ "$npm_version" != "$declared" ]; then
              echo "::error::the version is declared four times and they disagree"
              exit 1
            fi
          done
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$npm_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the declared version $npm_version"
            exit 1
          fi

  build-macos:
    name: Build the universal macOS bundle
    needs: check
    timeout-minutes: 90
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Both slices are compiled here and `lipo`d together, so both targets
      # have to be installed even though only one of them matches the runner.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: universal

      - run: pnpm install --frozen-lockfile

      # One artifact rather than one per architecture: a 10 MB download nobody
      # has to choose between beats two 5 MB ones and a chance of picking the
      # wrong one.
      - name: Build the bundle
        run: pnpm bundle --target universal-apple-darwin

      # `LSUIElement` is what keeps the app out of the Dock, and it comes from
      # `Info.plist` being merged into the bundle. A merge that silently stops
      # happening would otherwise only show up as a Dock icon on someone's Mac.
      - name: Check the bundled Info.plist
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/APOD Wallpaper.app"
          plist="$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$plist"
          /usr/libexec/PlistBuddy -c 'Print :NSAppleEventsUsageDescription' "$plist"

      # The whole point of the universal bundle is that both slices are in it,
      # and a build that quietly produced one would look completely normal --
      # right up until an Intel user reports an app that will not open.
      #
      # The deployment target is checked on both slices: it is what makes the
      # macOS version in the README true, and a slice built for something
      # newer would refuse to launch on the machines the app claims to serve.
      - name: Check the bundle is really universal
        run: |
          set -euo pipefail
          bin="src-tauri/target/universal-apple-darwin/release/bundle/macos/APOD Wallpaper.app/Contents/MacOS/apod-wallpaper"
          archs=$(lipo -archs "$bin")
          echo "architectures: $archs"
          for want in x86_64 arm64; do
            case " $archs " in
              *" $want "*) ;;
              *) echo "::error::the universal binary has no $want slice"; exit 1 ;;
            esac
          done

          declared=$(node -p "require('./src-tauri/tauri.conf.json').bundle.macOS.minimumSystemVersion")
          for arch in x86_64 arm64; do
            minos=$(otool -arch "$arch" -l "$bin" \
              | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
            echo "$arch minos=$minos declared=$declared"
            if [ "$minos" != "$declared" ]; then
              echo "::error::$arch slice targets $minos but the app advertises $declared"
              exit 1
            fi
          done

      # Same smoke test as the Linux job, and here it also proves the slice
      # that matches the runner actually starts.
      - name: Smoke test the binary
        run: |
          set -euo pipefail
          bin="src-tauri/target/universal-apple-darwin/release/bundle/macos/APOD Wallpaper.app/Contents/MacOS/apod-wallpaper"
          printed=$("$bin" --version)
          echo "reported: $printed"
          declared=$(node -p "require('./package.json').version")
          if [ "$printed" != "$declared" ]; then
            echo "::error::the binary reports $printed but the project declares $declared"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          if-no-files-found: error
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # Production is one job, installing what it produced is another. This one
  # takes the .dmg from the artifact store rather than from the build tree, so
  # what it mounts is byte for byte what a release attaches and a person
  # downloads.
  #
  # A Mac cannot be a container, which is why macOS is not a case in
  # install-linux's matrix but a job of its own on a macOS runner.
  #
  # Two limits worth stating. Gatekeeper is not exercised: these builds are
  # unsigned, and a file that CI produced carries no quarantine attribute, so
  # this says nothing about the `xattr -d` step the README gives users. And
  # only the slice matching the runner runs; the Intel one is checked by `lipo`
  # and `otool` in build-macos and executed nowhere.
  install-macos:
    name: Install the macOS bundle
    needs: build-macos
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      # Only for package.json: the version the installed binary reports is
      # compared against what the project declares, not against what another
      # job's binary happened to print.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: macos-universal
          path: artifacts

      - run: ls -la artifacts

      # Mount, drag to /Applications, eject: the way a person installs it.
      - name: Install it from the .dmg and start it
        run: |
          set -euo pipefail
          dmg=$(ls artifacts/*.dmg)
          echo "mounting $dmg"
          mount=$(mktemp -d)
          hdiutil attach "$dmg" -mountpoint "$mount" -nobrowse -quiet
          ls -la "$mount"

          sudo cp -R "$mount/APOD Wallpaper.app" /Applications/
          hdiutil detach "$mount" -quiet

          installed="/Applications/APOD Wallpaper.app/Contents/MacOS/apod-wallpaper"
          printed=$("$installed" --version)
          echo "reported from /Applications: $printed"
          declared=$(node -p "require('./package.json').version")
          if [ "$printed" != "$declared" ]; then
            echo "::error::the installed binary reports $printed but the project declares $declared"
            exit 1
          fi

          # The same assertion the Arch job makes, for the same reason: a build
          # that lost `custom-protocol` embeds no frontend and reaches for
          # devUrl instead. `pnpm bundle` sets the feature, and nothing here
          # had ever checked that it still did.
          #
          # Collected into a variable rather than piped into `grep -q`, which
          # under `pipefail` fails on a sound binary by SIGPIPE-ing `strings`.
          assets=$(strings "$installed" | grep -oE 'index-[A-Za-z0-9_-]+\.(js|css)' | sort -u || true)
          echo "embedded assets: ${assets:-<none>}"
          if ! grep -q '\.js$' <<< "$assets"; then
            echo "::error::$installed embeds no frontend asset, so the panel would load from devUrl"
            exit 1
          fi

  build-linux:
    name: Build the Linux packages
    needs: check
    timeout-minutes: 90
    # The newest generally available Ubuntu image, and that choice has a cost
    # worth naming. Distributions do not cross-compile for one another: what
    # decides where these packages run is the glibc they were linked against,
    # and a newer runner covers fewer systems, not more. 24.04 means glibc
    # 2.39, so Debian 12 and Ubuntu 22.04 -- both still supported, neither
    # current -- cannot install what this job builds. The README states the
    # resulting minimum the way it states macOS 13.3.
    #
    # Not ubuntu-26.04: it is a preview image, which GitHub may change or
    # withdraw without notice. Nothing that publishes release artifacts should
    # stand on one.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the Linux system dependencies
        run: |
          sudo apt-get update

          # Asked for on its own, deliberately. The runner image ships LLVM's
          # `libunwind-14-dev`, which conflicts with the plain `libunwind-dev`
          # that `libgstreamer1.0-dev` depends on. Put in the same transaction
          # as everything below, apt gives up on the lot with "held broken
          # packages"; given this one conflict by itself, it resolves it and
          # moves on. Nothing here wants LLVM's copy.
          sudo apt-get install --no-install-recommends -y libunwind-dev

          # `patchelf` is asked for by name rather than relied upon: the
          # AppImage's GStreamer plugin shells out to it, and the bundle
          # script refuses to start without it instead of failing twenty
          # minutes in. The runner image happens to carry it today.
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            patchelf \
            file

          # Runtime plugins, not just headers, and only in this job. The
          # AppImage carries its own copy of the media framework, so
          # `linuxdeploy` can only bundle what is installed here: base for the
          # pipeline, good for the MP4 demuxer, bad for the OpenH264 decoder
          # that a video APOD actually needs. The runner image ships none of
          # them, so without this the AppImage would bundle GStreamer's
          # libraries and no codecs at all.
          #
          # OpenH264 is BSD-licensed, which is why it is preferred here over
          # gstreamer1.0-libav: the licence section of the README says no GPL
          # component is linked in, and that stays true.
          sudo apt-get install --no-install-recommends -y \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux

      - run: pnpm install --frozen-lockfile

      # `.deb` for Debian and Ubuntu, `.rpm` for Fedora and RHEL, and an
      # AppImage for everything else, Arch included -- next to which the
      # PKGBUILD in packaging/arch/ builds natively from source.
      #
      # Through the script rather than `pnpm bundle` with the environment
      # spelled out here, so that this job and a developer's machine run the
      # same thing. Each variable it sets works around one Debian assumption
      # `linuxdeploy` makes, and the script documents which; they used to be
      # listed here and again in the README, where they could drift apart
      # silently.
      - name: Build the packages
        run: ./packaging/linux/bundle.sh

      # The GStreamer libraries are what `video_frame` decodes with, and they
      # are linked, not opened on demand: a binary that lost them would fail to
      # start rather than merely skip video APODs, and it would do so on the
      # user's machine and not here.
      - name: Check the binary links what it claims to
        run: |
          set -euo pipefail
          bin=src-tauri/target/release/apod-wallpaper
          linked=$(ldd "$bin" | sort)
          echo "$linked"
          # Matched against a variable for the reason spelled out in the Arch
          # job: `ldd | grep -q` only survives `pipefail` because ldd's output
          # is small enough to fit the pipe buffer before grep exits.
          for lib in libgstreamer-1.0 libgstvideo-1.0 libwebkit2gtk-4.1 libgio-2.0; do
            if ! grep -q "$lib" <<< "$linked"; then
              echo "::error::$bin does not link $lib"
              exit 1
            fi
          done

      # The binary is built here and never run, and the failure this catches is
      # exactly the one the GStreamer and appindicator dependencies introduce:
      # a link that resolves on the builder and not on the user's machine.
      # `--version` prints and exits before Tauri starts, so it needs no
      # display and still loads every shared library the binary names.
      - name: Smoke test the binary
        run: |
          set -euo pipefail
          printed=$(src-tauri/target/release/apod-wallpaper --version)
          echo "reported: $printed"
          declared=$(node -p "require('./package.json').version")
          if [ "$printed" != "$declared" ]; then
            echo "::error::the binary reports $printed but the project declares $declared"
            exit 1
          fi

      - name: Check every package format was produced
        run: |
          set -euo pipefail
          bundle=src-tauri/target/release/bundle
          for pattern in "$bundle"/deb/*.deb "$bundle"/rpm/*.rpm "$bundle"/appimage/*.AppImage; do
            # shellcheck disable=SC2086
            if ! compgen -G "$pattern" > /dev/null; then
              echo "::error::nothing matched $pattern"
              exit 1
            fi
          done
          ls -la "$bundle"/deb "$bundle"/rpm "$bundle"/appimage

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

  # The packages are built on Ubuntu and, until this job, installed nowhere.
  # What that left unchecked is not the code but the dependency names: the four
  # under `bundle.linux.rpm.depends` are Fedora's, written by hand, and no dnf
  # had ever resolved them. A wrong or renamed one produces a package that
  # builds, uploads, attaches to a release and fails on the user's machine.
  #
  # Each case starts from a stock image of the distribution the package targets
  # and lets that distribution's package manager resolve what the package
  # declares. Nothing is compiled here, and it is the only place a glibc other
  # than the runner's ever sees this binary.
  install-linux:
    name: Install ${{ matrix.case }}
    needs: [build-linux, build-arch]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: the .deb on Debian
            image: debian:stable-slim
            script: |
              apt-get update -qq
              pkg=$(ls ./linux/deb/*.deb)
              apt-get install -y "$pkg"
              apod-wallpaper --version

          - case: the .rpm on Fedora
            image: fedora:latest
            script: |
              pkg=$(ls ./linux/rpm/*.rpm)
              dnf install -y "$pkg"
              apod-wallpaper --version

          # The AppImage carries its own libraries, so what this asks is
          # whether it starts somewhere that is not Debian-shaped. It does not
          # reach GStreamer: `--version` prints and exits long before a video
          # APOD would be decoded, so a missing codec inside the bundle is not
          # what this catches.
          #
          # `APPIMAGE_EXTRACT_AND_RUN` because a container has no FUSE.
          - case: the AppImage on Fedora
            image: fedora:latest
            script: |
              app=$(ls ./linux/appimage/*.AppImage)
              chmod +x "$app"
              APPIMAGE_EXTRACT_AND_RUN=1 "$app" --version

          # The one case that installs what build-arch produced. It means more
          # here than it does there: `makepkg -s` had already installed every
          # dependency before the package existed, so nothing proved they could
          # be resolved from a clean system. `pacman -U` on a stock image does.
          # `-Sy` first, because that image carries no package database yet.
          - case: the Arch package on Arch
            image: archlinux:base
            script: |
              pacman -Sy --noconfirm
              pkg=$(ls ./arch/*.pkg.tar.zst | grep -v -- '-debug-')
              pacman -U --noconfirm "$pkg"
              apod-wallpaper --version
    steps:
      # Named one by one rather than downloading everything the run produced:
      # the macOS job's universal .dmg is large and has no business here.
      - uses: actions/download-artifact@v8
        with:
          name: linux-x86_64
          path: artifacts/linux

      - uses: actions/download-artifact@v8
        with:
          name: arch-x86_64
          path: artifacts/arch

      - run: ls -laR artifacts

      # Run through `docker` rather than the job's own `container:`, so that
      # the actions above keep running on the Ubuntu runner. A slim image has
      # no Node, and the one GitHub mounts into a container needs more of a
      # base system than `debian:stable-slim` carries.
      #
      # Tauri names its packages with a space in them ("APOD Wallpaper_0.2.0
      # _amd64.deb"), which is why each script assigns before it installs
      # rather than letting a glob reach the command unquoted.
      - name: Install it and start the binary
        run: |
          set -euo pipefail
          cat > steps.sh <<'INNER'
          set -euxo pipefail
          ${{ matrix.script }}
          INNER
          docker run --rm \
            -v "$PWD/artifacts:/artifacts" \
            -v "$PWD/steps.sh:/steps.sh:ro" \
            -w /artifacts \
            "${{ matrix.image }}" \
            bash /steps.sh

  # Arch is the one target Tauri has no bundler for, so `packaging/arch/PKGBUILD`
  # assembles the package itself -- and until this job, nothing checked that it
  # still worked. It had been quietly building a development binary: one that
  # installs, sets a wallpaper, then shows a connection error where the panel
  # should be. Only installing it by hand revealed that. This is the check that
  # was missing.
  build-arch:
    name: Build the Arch package
    needs: check
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    # `makepkg` exists only on Arch, and Arch is a rolling release: what is
    # worth building against is what an Arch user has today, which is what this
    # image tracks. Nothing is cached between runs for the same reason.
    #
    # The release job waits on this one. The cost is real and accepted: this
    # image is rolling, so a breakage upstream of the project can hold back a
    # publication. The alternative is worse -- shipping a tag whose PKGBUILD
    # produces the broken binary, which is exactly how v0.2.0 went out.
    container: archlinux:base-devel
    steps:
      # The image carries base-devel but not git, which `actions/checkout`
      # needs to clone rather than fall back to a REST download.
      - name: Install git
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v7

      # The PKGBUILD builds the *published tag*, which is right for a user and
      # useless here: on a pull request it would compile v0.2.0 and ignore the
      # code under review. So the tarball it expects is produced from this
      # checkout instead, under the exact name and prefix `build()` unpacks.
      # Only the provenance of the sources changes; `build()`, `check()` and
      # `package()` run byte for byte as an AUR user runs them.
      - name: Point the PKGBUILD at this checkout
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pkgver=$(grep -m1 '^pkgver=' packaging/arch/PKGBUILD | cut -d= -f2)
          git archive --format=tar.gz \
            --prefix="apod-wallpaper-$pkgver/" \
            -o "packaging/arch/apod-wallpaper-$pkgver.tar.gz" HEAD

          cd packaging/arch
          sed -i 's|^source=.*|source=("$pkgname-$pkgver.tar.gz")|' PKGBUILD
          sed -i "s|^sha256sums=.*|sha256sums=('SKIP')|" PKGBUILD
          echo "--- the two lines that differ from the published PKGBUILD ---"
          grep -E '^(source|sha256sums)=' PKGBUILD

      # `makepkg` refuses to run as root, and a container runs as root.
      - name: Create the user makepkg insists on
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      # `-s` installs `depends` and `makedepends` through pacman, which is the
      # second thing this job is for: a dependency the PKGBUILD forgets to
      # declare is one the build no longer finds, here, rather than on a user's
      # machine. `check()` in the PKGBUILD runs the test suite as part of this.
      - name: Build the package
        working-directory: packaging/arch
        run: sudo -u builder makepkg -s --noconfirm

      # The regression that prompted this job. Tauri picks a development or a
      # production build from the `custom-protocol` feature, which the CLI sets
      # and a bare `cargo build --release` does not. A development binary
      # compiles, links, passes its tests and installs; its one visible trace
      # is that it embeds no frontend and reaches for `devUrl` instead.
      - name: Check the package carries a production binary
        working-directory: packaging/arch
        run: |
          set -euo pipefail
          pkg=$(ls ./*-x86_64.pkg.tar.zst | grep -v -- '-debug-')
          echo "inspecting $pkg"
          mkdir -p inspect
          bsdtar -xf "$pkg" -C inspect
          find inspect -type f -not -name '.*' | sort

          bin=inspect/usr/bin/apod-wallpaper

          # Collected once into a variable rather than tested with
          # `strings ... | grep -q`. Under `pipefail` that form fails on a
          # *good* package: `grep -q` exits at the first match, `strings` gets
          # SIGPIPE partway through 13 MB of output, and its 141 becomes the
          # pipeline's status. Verified on a package known to be sound.
          assets=$(strings "$bin" | grep -oE 'index-[A-Za-z0-9_-]+\.(js|css)' | sort -u || true)
          echo "embedded assets: ${assets:-<none>}"

          if ! grep -q '\.js$' <<< "$assets"; then
            echo "::error::$bin embeds no frontend asset, so it is a development build: the panel would load from devUrl and fail to connect"
            exit 1
          fi

          for file in \
            "usr/bin/apod-wallpaper" \
            "usr/share/applications/APOD Wallpaper.desktop" \
            "usr/share/licenses/apod-wallpaper/LICENSE" \
            "usr/share/icons/hicolor/128x128/apps/apod-wallpaper.png"; do
            if [ ! -f "inspect/$file" ]; then
              echo "::error::the package is missing $file"
              exit 1
            fi
          done

      # The same smoke test the Linux job runs, and it means more here: pacman
      # installed the runtime dependencies the PKGBUILD declares and nothing
      # else, so a library the package forgot to depend on fails to resolve
      # right here. `--version` prints and exits before Tauri starts, so it
      # needs no display.
      - name: Smoke test the packaged binary
        working-directory: packaging/arch
        run: |
          set -euo pipefail
          printed=$(inspect/usr/bin/apod-wallpaper --version)
          echo "reported: $printed"
          declared=$(grep -m1 '^pkgver=' PKGBUILD | cut -d= -f2)
          if [ "$printed" != "$declared" ]; then
            echo "::error::the binary reports $printed but the PKGBUILD declares $declared"
            exit 1
          fi

      # Kept for inspection, deliberately not attached to a release. A binary
      # Arch package is linked against the webkit2gtk and GStreamer sonames of
      # the day it was built, and on a rolling distribution that makes it
      # rubbish within weeks. Arch users build from the PKGBUILD, which is
      # exactly what this job proves still works.
      - uses: actions/upload-artifact@v7
        with:
          name: arch-x86_64
          if-no-files-found: error
          retention-days: 14
          path: packaging/arch/*.pkg.tar.zst

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    # Everything that builds or installs a package gates this. `build-arch`
    # although the release carries no Arch package, because the README sends
    # Arch users to the PKGBUILD and a tag whose recipe is broken is an
    # incomplete release even when every attached file is sound -- which is
    # what happened to v0.2.0. And `install-linux` because the files it
    # installs are the ones attached here: a package that no package manager
    # will install must not reach the releases page.
    needs: [build-macos, install-macos, build-linux, build-arch, install-linux]
    # Only downloads the artifacts and attaches them to the tag: nothing is
    # compiled here, so the cheapest runner does.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
          # These builds are unsigned; the README explains the Gatekeeper step
          # macOS users need.
          body: |
            **macOS**: one universal `.dmg`, for Apple silicon and Intel alike.
            It is unsigned, so after installing run
            `xattr -d com.apple.quarantine "/Applications/APOD Wallpaper.app"`.

            **Linux**: `.deb` for Debian and Ubuntu, `.rpm` for Fedora and
            RHEL, and an `.AppImage` that runs anywhere. GNOME only for now.
            Arch users can build from `packaging/arch/PKGBUILD` instead.

            See the README for details.
